spring.application.name=organizacion-service

spring.config.import=optional:file:./infra/docker/.env[.properties],optional:file:../../infra/docker/.env[.properties]

spring.datasource.url=${DATASOURCE_URL_DB}
spring.datasource.username=${DATASOURCE_USERNAME_DB}
spring.datasource.password=${DATASOURCE_PASSWORD_DB}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true